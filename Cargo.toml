[package]
name = "sporeflow"
version = "0.5.0"
edition = "2021"
description = "SporeFlow: Zero-copy pure-Rust co-located sidecar accelerator with Fedora 45, KVM probe, 1.3KB no_std Wasm UI, and raw binary :9090 conduit"
repository = "https://github.com/exefncs2/sporeflow"
homepage = "https://github.com/exefncs2/sporeflow"
license = "MIT"

[dependencies]
libc = "0.2"
kvm-ioctls = "0.25"
kvm-bindings = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
