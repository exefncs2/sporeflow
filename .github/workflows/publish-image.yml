name: Build and Publish Fedora 45 Image

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASS: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ghcr.io/exefncs2/sporeflow:latest
            ghcr.io/exefncs2/sporeflow:fedora45
            ghcr.io/exefncs2/sporeflow:${{ github.sha }}

      - name: Log in to Docker Hub (optional)
        if: env.DOCKERHUB_USER != '' && env.DOCKERHUB_PASS != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USER }}
          password: ${{ env.DOCKERHUB_PASS }}

      - name: Push image to Docker Hub (optional)
        if: env.DOCKERHUB_USER != '' && env.DOCKERHUB_PASS != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USER }}/sporeflow:latest
            ${{ env.DOCKERHUB_USER }}/sporeflow:fedora45

      - name: Trivy Filesystem & Rust Dependency Vulnerability Scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'MEDIUM,HIGH,CRITICAL'
          exit-code: '0'

      - name: Trivy Container Image CVE Scan (GHCR)
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: 'ghcr.io/exefncs2/sporeflow:latest'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '0'
